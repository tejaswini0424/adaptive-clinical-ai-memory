<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clinical AI Memory</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#18334c;background:#f2f7fb}*{box-sizing:border-box}body{margin:0}aside{background:#102c47;color:#e8f6ff;position:fixed;width:230px;height:100vh;padding:28px 18px}aside h2{font-size:20px;margin-bottom:32px}nav button{display:block;width:100%;text-align:left;background:none;color:inherit;border:0;padding:13px;border-radius:8px;margin:4px 0}nav button.active,nav button:hover{background:#224963}main{margin-left:230px;padding:35px;max-width:1600px}h1{font-size:29px;letter-spacing:-1px;margin-bottom:10px}h2{font-size:23px}small,.muted{color:#667e90}.banner{background:#e2f3f4;border-radius:9px;padding:12px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card,details{background:white;border:1px solid #dde8ef;border-radius:13px;padding:22px;margin-bottom:16px}.metric{font-size:34px;color:#087f86;font-weight:700;margin-top:12px}input,textarea,select{font:inherit;width:100%;padding:11px;border:1px solid #ccdae3;border-radius:7px;margin:6px 0 15px;background:white;color:#18334c}textarea{min-height:120px}label{display:block;font-size:14px}button{font:inherit;cursor:pointer;border:0;border-radius:7px;padding:11px 17px;background:#087f86;color:white;margin:4px 5px 4px 0}button.secondary{background:#e8eff5;color:#203f57}button.danger{background:#ad3546}summary{cursor:pointer;font-weight:600}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;line-height:1.6}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px;text-align:left;border-bottom:1px solid #e6edf2;overflow-wrap:anywhere}#notice{padding:12px;border-radius:7px;background:#ffebeb;display:none}#auth{max-width:480px;margin:9vh auto}#auth h1{font-size:32px}.bar{height:12px;background:#079d98;border-radius:8px;margin:7px 0 16px}.chart-label{display:flex;justify-content:space-between;font-size:13px}.badge{display:inline-block;padding:4px 8px;background:#e5f4f1;border-radius:5px;font-size:12px}.scroll{overflow:auto}a{color:#087f86}@media(max-width:850px){aside{position:static;width:100%;height:auto}nav{display:flex;flex-wrap:wrap}nav button{width:auto;font-size:12px}main{margin:0;padding:18px}.grid,.two{grid-template-columns:1fr}h1{font-size:24px}}
</style></head><body><div id="notice" role="alert"></div><div id="root"></div>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=sessionStorage.getItem('token'),username=sessionStorage.getItem('username'),page='Overview',data={},docs=[],chat=[];
const pages=['Overview','Knowledge Repository','Adaptive Memory','Knowledge Retrieval','Evidence Updates','AI Agents','Search & Chat','Reports & Analytics'];
async function api(path,method='GET',body){const options={method,headers:{Authorization:'Bearer '+token}};if(body instanceof FormData)options.body=body;else if(body){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body)}const r=await fetch(path,options);if(!r.ok){let e;try{e=await r.json()}catch{e={detail:r.statusText}}if(r.status===401&&token){token=null;sessionStorage.clear();auth()}throw Error(typeof e.detail==='string'?e.detail:JSON.stringify(e.detail))}return r.headers.get('content-type')?.includes('text/csv')?r.blob():r.json()}
function fail(e){$('#notice').textContent=e.message;$('#notice').style.display='block';window.scrollTo(0,0)}
async function task(fn){$('#notice').style.display='none';try{await fn()}catch(e){fail(e)}}
function auth(){document.querySelector('#root').innerHTML=`<div id="auth" class="card"><div class="badge">RESEARCH & EDUCATION</div><h1>Clinical AI<br>Memory Intelligence</h1><p class="muted">Knowledge that remembers. Evidence that evolves.</p><form id="credentials"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button name="action" value="login">Sign in</button><button class="secondary" name="action" value="register">Create account</button></form><p><small>Create your own account. No administrator approval required. Use synthetic or public material only.</small></p></div>`;$('#credentials').onsubmit=e=>{e.preventDefault();task(async()=>{let r=await api('/auth/'+e.submitter.value,'POST',Object.fromEntries(new FormData(e.target)));token=r.token;username=r.username;sessionStorage.setItem('token',token);sessionStorage.setItem('username',username);await render()})}}
function shell(){document.querySelector('#root').innerHTML=`<aside><h2>🧬 Clinical Memory</h2><nav>${pages.map(p=>`<button class="${page===p?'active':''}" data-page="${p}">${p}</button>`).join('')}</nav><hr><p>Signed in as<br><strong>${esc(username)}</strong></p><button id="logout">Log out</button></aside><main><h1>Clinical AI Memory Intelligence Platform</h1><small id="clock"></small><div class="banner">Research & education · Evidence requires human review · No diagnosis or treatment advice</div><h2>${page}</h2><section id="content"></section></main>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>task(async()=>{page=b.dataset.page;await render()}));$('#logout').onclick=()=>task(async()=>{await api('/auth/logout','POST');sessionStorage.clear();token=null;chat=[];auth()});clock()}
function clock(){if($('#clock'))$('#clock').textContent=new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})+' IST · Signed in'}setInterval(clock,1000);
function fields(d={}){return `<label>Title<input name="title" value="${esc(d.title)}" required></label><label>Text / evidence passage<textarea name="content" required>${esc(d.content)}</textarea></label><label>Category<input name="category" value="${esc(d.category||'General')}"></label><label>Source / public evidence URL<input name="source" value="${esc(d.source||'Manual entry')}"></label><label>Publication date<input name="published_at" type="date" value="${esc(d.published_at)}"></label>`}
function formdata(f){return Object.fromEntries(new FormData(f))}
function bars(items,key,title){let counts={};items.forEach(x=>counts[x[key]]=(counts[x[key]]||0)+1);let max=Math.max(1,...Object.values(counts));return `<div class="card"><strong>${title}</strong>${Object.keys(counts).length?Object.entries(counts).map(([k,v])=>`<div class="chart-label"><span>${esc(k)}</span><b>${v}</b></div><div class="bar" style="width:${v/max*100}%" title="${esc(k)}: ${v}"></div>`).join(''):'<p class="muted">No activity yet</p>'}</div>`}
function charts(){let documents=data.documents.map(d=>({...d,day:d.created_at.slice(0,10)}));return '<div class="two">'+bars(documents,'day','Knowledge records by date')+bars(data.retrievals,'hits','Retrieval result counts')+bars(data.evidence,'status','Evidence review status')+bars(data.agents,'agent','Agent task activity')+bars(data.memories,'kind','Memory utilization')+'</div>'}
async function render(){shell();let c=$('#content');c.textContent='Loading…';if(['Overview','AI Agents','Reports & Analytics'].includes(page)){data=await api('/analytics');if(page==='Overview'){let metrics=[['Knowledge records',data.knowledge_records],['Stored memories',data.memories.length],['Evidence documents',data.evidence.length],['Successful retrievals',data.retrievals.filter(x=>x.hits>0).length],['Accepted updates',data.evidence.filter(x=>x.status==='accepted').length],['Agent tasks',data.agents.length]];c.innerHTML='<div class="grid">'+metrics.map(([k,v])=>`<div class="card">${k}<div class="metric">${v}</div></div>`).join('')+'</div>'+(!data.documents.length?'<button id="demo">Load synthetic demo</button>':'')+charts();if($('#demo'))$('#demo').onclick=()=>task(async()=>{await api('/demo','POST');await render()})}else if(page==='AI Agents'){c.innerHTML=['Memory Agent','Retrieval Agent','Evidence Agent','Summarization Agent','Update Agent'].map(name=>{let a=data.agents.filter(t=>t.agent===name);return `<div class="card"><h3>${name} <span class="badge">Ready · synchronous</span></h3><p>Tasks: ${a.length} · Successful: ${a.filter(x=>x.status==='success').length} · Last execution: ${esc(a[0]?.created_at||'Not run')}</p></div>`}).join('')}else{c.innerHTML=charts()+`<div class="card"><h3>CSV exports</h3>${['documents','memories','retrievals','evidence','agents','memory_history','versions'].map(n=>`<button data-report="${n}">${n}</button>`).join('')}</div>`;document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>task(async()=>{const blob=await api('/reports/'+b.dataset.report);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=b.dataset.report+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}))}return}
if(page==='Knowledge Repository'){docs=await api('/documents');c.innerHTML=`<details><summary>Add knowledge</summary><form id="newdoc">${fields()}<button>Save record</button></form></details><details><summary>Upload PDF / TXT</summary><form id="upload"><input name="file" type="file" accept=".txt,.pdf" required><input name="category" value="General"><button>Upload document</button></form></details><input id="search" placeholder="Search title, text, category"><div id="records"></div>`;$('#newdoc').onsubmit=e=>{e.preventDefault();task(async()=>{await api('/documents','POST',formdata(e.target));await render()})};$('#upload').onsubmit=e=>{e.preventDefault();task(async()=>{await api('/documents/upload','POST',new FormData(e.target));await render()})};let list=()=>{$('#records').innerHTML=docs.filter(d=>(d.title+d.content+d.category).toLowerCase().includes($('#search').value.toLowerCase())).map(d=>`<details><summary>${esc(d.title)} · ${esc(d.category)} · #${d.id}</summary><small>Updated ${esc(d.updated_at)}</small><form data-edit="${d.id}">${fields(d)}<button>Save changes</button></form><button class="danger" data-delete="${d.id}">Delete record</button></details>`).join('');document.querySelectorAll('[data-edit]').forEach(f=>f.onsubmit=e=>{e.preventDefault();task(async()=>{await api('/documents/'+f.dataset.edit,'PUT',formdata(f));await render()})});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Permanently delete this record?'))task(async()=>{await api('/documents/'+b.dataset.delete,'DELETE');await render()})})};$('#search').oninput=list;list();return}
if(page==='Adaptive Memory'){c.innerHTML=`<p class="muted">Short-term memories remain active for 24 hours. Searches track access counts. Query episodes are retained automatically.</p><details><summary>Store memory</summary><form id="newmemory"><textarea name="content" required placeholder="Memory content"></textarea><select name="kind">${['short-term','long-term','semantic','episodic'].map(k=>`<option>${k}</option>`).join('')}</select><input name="source" value="User"><button>Store memory</button></form></details><form id="findmemory"><input name="q" placeholder="Find related memories"><button>Search memories</button></form><div id="memories"></div>`;$('#newmemory').onsubmit=e=>{e.preventDefault();task(async()=>{await api('/memories','POST',formdata(e.target));await render()})};async function load(q=''){const ms=await api('/memories?q='+encodeURIComponent(q));$('#memories').innerHTML=ms.map(m=>`<details><summary>${esc(m.kind)} · ${esc(m.content.slice(0,75))}</summary><small>Source: ${esc(m.source)} · Accesses: ${m.accesses} · Updated: ${esc(m.updated_at)} · Relevance: ${m.score??'—'}</small><form data-memory="${m.id}"><textarea name="content" required>${esc(m.content)}</textarea><input name="source" value="${esc(m.source)}"><input name="kind" type="hidden" value="${esc(m.kind)}"><button>Update memory</button></form><button class="danger" data-removememory="${m.id}">Remove</button></details>`).join('');document.querySelectorAll('[data-memory]').forEach(f=>f.onsubmit=e=>{e.preventDefault();task(async()=>{await api('/memories/'+f.dataset.memory,'PUT',formdata(f));await load(q)})});document.querySelectorAll('[data-removememory]').forEach(b=>b.onclick=()=>task(async()=>{await api('/memories/'+b.dataset.removememory,'DELETE');await load(q)}))}$('#findmemory').onsubmit=e=>{e.preventDefault();task(()=>load(formdata(e.target).q))};await load();return}
if(page==='Knowledge Retrieval'||page==='Search & Chat'){c.innerHTML='<form id="query"><input name="query" required placeholder="Ask about your stored evidence"><button>Retrieve evidence</button></form><div id="answers"></div>';function answer(q,r){return `<div class="card"><h3>${esc(q)}</h3><small>Engine: ${esc(r.engine)}</small><h3>Retrieved evidence · original passages</h3>${r.evidence.map(h=>`<details open><summary>[${h.document_id}] ${esc(h.title)} · score ${h.score}</summary><pre>${esc(h.passage)}</pre><small>Source: ${esc(h.source)} · Published: ${esc(h.published_at||'Unknown')}</small></details>`).join('')||'<p>No matching passages.</p>'}<h3>Automatically assembled explanation</h3><small>${esc(r.explanation_type)}</small><pre>${esc(r.explanation)}</pre><details><summary>Related memories</summary>${r.related_memories.map(m=>`<p>${esc(m.content)} · ${m.score}</p>`).join('')}</details></div>`}if(page==='Search & Chat')$('#answers').innerHTML=chat.map(x=>answer(x.q,x.r)).join('');$('#query').onsubmit=e=>{e.preventDefault();task(async()=>{const q=formdata(e.target).query,r=await api('/retrieve','POST',{query:q});if(page==='Search & Chat'){chat.unshift({q,r});$('#answers').innerHTML=chat.map(x=>answer(x.q,x.r)).join('')}else $('#answers').innerHTML=answer(q,r)})};return}
if(page==='Evidence Updates'){docs=await api('/documents');let evidence=await api('/evidence');c.innerHTML=`<p class="muted">Chronology, text overlap, and negation signals cannot establish clinical contradictions. Review original evidence. Acceptance explicitly replaces the selected target content.</p><details><summary>Submit new evidence</summary><form id="newevidence">${fields()}<label>Compare with existing record<select name="target_id"><option value="">No target</option>${docs.map(d=>`<option value="${d.id}">${esc(d.title)}</option>`).join('')}</select></label><button>Compare & propose update</button></form></details>`+evidence.map(e=>`<details open><summary>Review #${e.id} · ${esc(e.status)}</summary><p>${esc(e.comparison)}</p>${e.versions.map(v=>`<small>${esc(v.decision)} · ${esc(v.created_at)}</small><div class="two"><div><h4>Old evidence</h4><pre>${esc(v.old_content)}</pre></div><div><h4>New evidence</h4><pre>${esc(v.new_content)}</pre></div></div>`).join('')}${e.status==='pending'?`<button data-review="${e.id}" data-decision="accepted">Accept update</button><button class="secondary" data-review="${e.id}" data-decision="rejected">Reject update</button>`:''}</details>`).join('');$('#newevidence').onsubmit=e=>{e.preventDefault();task(async()=>{let body=formdata(e.target);body.target_id=body.target_id?Number(body.target_id):null;await api('/evidence','POST',body);await render()})};document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{if(confirm('Record this evidence decision: '+b.dataset.decision+'?'))task(async()=>{await api('/evidence/'+b.dataset.review+'/review','POST',{decision:b.dataset.decision});await render()})})}
}
token?task(render):auth();
</script></body></html>
